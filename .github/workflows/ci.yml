# Checks that run on every pull request.
#
# Deliberately cheap and offline: no containers, no database, no network. Their
# job is to catch the class of mistake that would otherwise be found by a broken
# deploy - a syntax error, a compose file that no longer parses, an image that
# no longer builds.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Syntax and config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php8.3-cli
          find src -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "$(find src -name '*.php' | wc -l) PHP files parse"

      - name: JavaScript syntax
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "$(find src -name '*.js' | wc -l) JS files parse"

      - name: Shell syntax
        run: find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Compose files parse
        run: |
          docker compose --project-directory . -f devops/dev/compose.yml \
            --env-file .env.example config -q
          docker compose --project-directory . -f devops/prod/compose.yml \
            --env-file devops/prod/.env.example config -q

      - name: Migrations are ordered and unique
        run: |
          dupes=$(ls src/ops/migrations/*.php | xargs -n1 basename | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "duplicate migration names: $dupes"; exit 1; fi
          echo "$(ls src/ops/migrations/*.php | wc -l) migrations"

  build:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Built but not pushed: a pull request proves the image can be produced,
      # it does not get to publish one.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: devops/image/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
