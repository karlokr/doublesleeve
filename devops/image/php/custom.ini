; PrestaShop 9 recommends >= 512M per script.
memory_limit = 512M

; Product CSV imports and card image batches need generous limits.
upload_max_filesize = 64M
post_max_size = 64M
max_input_vars = 20000
max_execution_time = 300

; Route all outbound mail to Mailpit so dev never emails real customers.
sendmail_path = /usr/sbin/sendmail -S mailpit:1025
