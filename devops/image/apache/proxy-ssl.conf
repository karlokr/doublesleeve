# Traefik terminates TLS and forwards plain http, so PHP sees an insecure
# request and PrestaShop refuses to open the back office: "SSL is activated.
# Please connect using the following link to log in to secure mode" on a URL
# that is already https.
#
# The obvious fix - PS_TRUSTED_PROXIES, so Symfony honours X-Forwarded-Proto -
# cannot work. admin/index.php calls
#
#     Request::setTrustedProxies([], ...)
#
# with an empty array immediately before $kernel->handle(), wiping whatever the
# framework config set. There is no configuration that survives that.
#
# So set HTTPS at the web server instead. Both code paths read it before they
# reach any proxy logic: Tools::usingSecureMode() checks $_SERVER['HTTPS']
# first, and Symfony's Request::isSecure() checks it for non-proxied requests.
#
# Safe because nothing but Traefik can reach this container - no port is
# published - so the header cannot be spoofed by a client.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
