# Shared ingress. NOT part of the doublesleeve stack, and not owned by this
# repository - it fronts every app on the host. Kept here because stack.yml is
# unreadable without it: the `proxy` network, the `websecure` entrypoint and the
# `sslresolver` certresolver that our Traefik labels name all come from here.
#
# Deploy this FIRST. It creates the `proxy` overlay network, which stack.yml
# joins as external; deploying doublesleeve before it exists just fails.
#
#   docker stack deploy -c devops/prod/traefik-stack.yml traefik
#   docker stack deploy -c devops/prod/stack.yml doublesleeve
#
# Keep this file byte-identical to what is actually deployed, so it stays
# diffable. If the entrypoint or certresolver names change here, the Traefik
# labels in stack.yml have to change with them.
version: "3.8"

networks:
  traefik-docker:
    name: traefik-docker
    driver: overlay
  proxy:
    driver: overlay
    name: proxy

services:
  traefik:
    image: traefik:v3.6
    command:
      # INFO in prod: DEBUG logs request headers/routing detail (log volume +
      # info disclosure). The Traefik API/dashboard is not enabled — no router
      # publishes api@internal, so keep the handler off entirely (OWASP audit).
      - --log.level=INFO
      - --providers.swarm
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.network=proxy
      - --providers.swarm.exposedbydefault=false
      # EntryPoints
      - --entrypoints.web.address=:80
      # Managed by devops/prod/scripts/update_cloudflare_trusted_ips.sh
      - --entrypoints.web.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      # Managed by devops/prod/scripts/update_cloudflare_trusted_ips.sh
      - --entrypoints.websecure.forwardedHeaders.trustedIPs=173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22,2400:cb00::/32,2606:4700::/32,2803:f800::/32,2405:b500::/32,2405:8100::/32,2a06:98c0::/29,2c0f:f248::/32
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=sslresolver
      # Ping (healthcheck)
      - --ping
      - --ping.entrypoint=ping
      - --entrypoints.ping.address=:8080
      # Prometheus metrics on a dedicated internal entrypoint (:8082, not published).
      # Scraped by the monitoring stack's Prometheus over the shared proxy network.
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus=true
      - --metrics.prometheus.entryPoint=metrics
      - --metrics.prometheus.addEntryPointsLabels=true
      - --metrics.prometheus.addRoutersLabels=true
      - --metrics.prometheus.addServicesLabels=true
      # Timeouts
      - --entrypoints.websecure.transport.respondingTimeouts.readTimeout=3600s
      - --entrypoints.websecure.transport.respondingTimeouts.writeTimeout=3600s
      - --entrypoints.websecure.transport.respondingTimeouts.idleTimeout=600s
      # Let's Encrypt with Cloudflare DNS challenge
      - --certificatesresolvers.sslresolver.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.sslresolver.acme.dnschallenge=true
      - --certificatesresolvers.sslresolver.acme.dnschallenge.provider=cloudflare
    depends_on:
      - socket-proxy
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    volumes:
      - /srv/protected/acme:/etc/traefik/acme
      - /var/run/docker.sock:/var/run/docker.sock:ro

    deploy:
      mode: global
      restart_policy:
        condition: any
      update_config:
        delay: 10s
        # stop-first (not start-first): this is a global service binding host
        # ports 80/443 on a single node — a new task can't double-bind them, so
        # start-first deadlocks in Pending. Brief ingress blip on redeploy.
        order: stop-first
        parallelism: 1
      rollback_config:
        parallelism: 0
        order: stop-first

    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: "20s"
      timeout: "5s"
      retries: 3
      start_period: "30s"

    networks:
      - traefik-docker
      - proxy

    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
