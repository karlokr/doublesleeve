# Production.
#
# The difference from devops/dev/compose.yml is not configuration, it is where
# the code comes from. Development bind-mounts src/ so an edit is live; here the
# code arrives inside a tagged image and nothing is mounted over it.
#
#   docker compose --project-name doublesleeve --env-file .env \
#     -f devops/prod/compose.yml pull
#   docker compose ... up -d
#
# Deploying a different version means changing APP_IMAGE_TAG and repeating that.
# Rolling back means naming the previous tag. There is no other step, because
# the image is the artifact.
services:
  db:
    image: mariadb:11.4
    container_name: doublesleeve-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  shop:
    image: ${APP_IMAGE}:${APP_IMAGE_TAG}
    container_name: doublesleeve-shop
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      PS_DOMAIN: ${PS_DOMAIN}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      PS_SSL_ENABLED: 1
      # The shop is already installed in production; this must never re-run.
      PS_INSTALL_AUTO: 0
    ports:
      - "${PS_PORT}:80"
    volumes:
      # ONLY the paths that hold state.
      #
      # This is the whole reason the image works. A volume over /var/www/html -
      # which is what development does - would hide the modules and the theme
      # baked into the image, and a deploy would appear to change nothing.
      # Everything not listed here comes from the image and is replaced wholesale.
      - ps_img:/var/www/html/img
      - ps_var:/var/www/html/var
      - ps_upload:/var/www/html/upload
      - ps_download:/var/www/html/download
      # Written by the installer and holds this shop's database credentials.
      - ps_config:/var/www/html/app/config

  meilisearch:
    image: getmeili/meilisearch:v1.53
    container_name: doublesleeve-meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data

  cron:
    image: ${APP_IMAGE}:${APP_IMAGE_TAG}
    container_name: doublesleeve-cron
    restart: unless-stopped
    depends_on:
      - shop
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
    # Same image as the shop, so the scheduled jobs run exactly the code the
    # site serves. The base image ships no cron daemon; see devops/image/cron.
    command: ["cron", "-f", "-L", "15"]
    volumes:
      - ps_img:/var/www/html/img
      - ps_var:/var/www/html/var

volumes:
  db_data:
  meili_data:
  ps_img:
  ps_var:
  ps_upload:
  ps_download:
  ps_config:
