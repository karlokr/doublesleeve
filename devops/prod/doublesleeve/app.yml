# ─────────────────────────────────────────────────────────────────────────────
# doublesleeve — the shop itself (Swarm stack, single node)
#
# Deploy:
#   docker stack deploy -c app.yml doublesleeve
#
# NOTE: the live copy is /swarm/stacks/app.yml on the host. This file is the
# version-controlled record of it. If you change one, change the other.
#
# A first deploy onto an empty database builds the entire shop by itself:
# PrestaShop installs, then the base image runs /tmp/post-install-scripts/,
# which runs bootstrap.sh - catalogue, inventory, imagery, prices, search. It
# takes a while and fetches from upstream, and it happens exactly once.
#
# This is the only stack that moves on a release. Upgrading is changing
# APP_IMAGE_TAG and redeploying; nothing runs before or after, because the
# container applies pending migrations itself on start
# (devops/image/entrypoint.sh) and the ledger makes that free when there is
# nothing pending.
#
# Rolling back is redeploying the previous tag, and it is safe because
# migrations are forward-only and backward-compatible - the older image runs
# against the newer schema. See docs/deployment.md, "The upgrade contract".
#
# Deploying this does NOT restart the database or the search index. They are
# separate stacks precisely so a code release cannot bounce them.
#
# Depends on, and does not create: the `proxy` network (traefik stack) and
# `doublesleeve_internal` (created once, see docs/deployment.md).
#
# Env: APP_IMAGE_TAG  DB_NAME  DB_USER  DB_PASSWORD  DB_PREFIX  PS_DOMAIN
#      PS_FOLDER_ADMIN  MEILI_MASTER_KEY  ADMIN_MAIL  ADMIN_PASSWORD
# ─────────────────────────────────────────────────────────────────────────────
version: "3.8"

services:
  shop:
    image: ${APP_IMAGE:-ghcr.io/karlokr/doublesleeve}:${APP_IMAGE_TAG:-latest}
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      PS_DOMAIN: ${PS_DOMAIN}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      # Read by getenv() in the search module's ajax controller, which talks to
      # Meilisearch directly. Same value as the search stack, or every query
      # comes back 403 and the storefront search box silently returns nothing.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      DB_PREFIX: ${DB_PREFIX:-cc_}
      # PS_INSTALL_AUTO / PS_ERASE_DB / PS_INSTALL_DB are deliberately absent.
      # The entrypoint sets them from what the database actually contains, so a
      # stale copy of this file cannot silently skip the install.
      ADMIN_MAIL: ${ADMIN_MAIL}
      ADMIN_PASSWD: ${ADMIN_PASSWORD}
      PS_LANGUAGE: ${PS_LANGUAGE:-en}
      PS_COUNTRY: ${PS_COUNTRY:-ca}
      PS_ALL_LANGUAGES: "0"
      # 1, not 0. This is what the installer writes into ps_configuration as
      # PS_SSL_ENABLED, and it decides whether the storefront's canonical URLs
      # are https. With 0, PrestaShop 302s every request down to http and
      # Traefik 301s it back up: an infinite redirect loop.
      PS_ENABLE_SSL: "1"
      # Must stay 0: the shim it installs becomes the Apache DirectoryIndex and
      # unconditionally redirects to index.php, which with friendly URLs
      # resolves back to "/" - an infinite 302 loop.
      PS_HANDLE_DYNAMIC_DOMAIN: "0"
      PS_FOLDER_INSTALL: install
    volumes:
      # Only state. Everything else - core, modules, theme, ops - comes from the
      # image and is replaced wholesale, which is what makes a deploy atomic.
      - ps_img:/var/www/html/img
      - ps_var:/var/www/html/var
      - ps_upload:/var/www/html/upload
      - ps_download:/var/www/html/download
      - ps_config:/var/www/html/app/config
    networks: [proxy, internal]
    deploy:
      replicas: 1
      update_config:
        # One at a time, and only after the new task is actually healthy. This
        # is what makes "change the tag and redeploy" safe on its own.
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 90s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
      resources:
        limits: { memory: 4G }
        reservations: { memory: 1G }
      # Ingress is stacks/traefik.yml, which owns the `proxy` network, the
      # `websecure` entrypoint and the `sslresolver` resolver named here. Port
      # 80 is the container port; Traefik terminates TLS and http is redirected
      # to https upstream.
      labels:
        traefik.enable: "true"
        # This service sits on two networks. The provider defaults to proxy, but
        # say it, so adding a third network later cannot make routing ambiguous.
        traefik.swarm.network: proxy
        traefik.http.routers.doublesleeve.rule: Host(`doublesleeve.org`) || Host(`www.doublesleeve.org`)
        traefik.http.routers.doublesleeve.entryPoints: websecure
        traefik.http.routers.doublesleeve.priority: "1000"
        traefik.http.routers.doublesleeve.tls.certresolver: sslresolver
        traefik.http.routers.doublesleeve.tls.domains[0].main: doublesleeve.org
        traefik.http.routers.doublesleeve.tls.domains[0].sans: "www.doublesleeve.org"
        traefik.http.routers.doublesleeve.service: doublesleeve
        traefik.http.services.doublesleeve.loadbalancer.server.port: 80
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      # Generous, because a first start migrates before it serves anything.
      start_period: 180s

  cron:
    # Same stack as the shop, and deliberately not its own: it runs the same
    # image, so splitting it would let scheduled work drift onto a different
    # version of the code than the site is serving.
    image: ${APP_IMAGE:-ghcr.io/karlokr/doublesleeve}:${APP_IMAGE_TAG:-latest}
    entrypoint: ["cron", "-f", "-L", "15"]
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      # search-index.php reads this to rebuild the index.
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # Migrations are the web container's job. Two containers racing the same
      # ledger is what the lock exists for, but there is no reason to make it
      # work for a living.
      CC_MIGRATE: "0"
    volumes:
      - ps_img:/var/www/html/img
      - ps_var:/var/www/html/var
      - ps_config:/var/www/html/app/config
    networks: [internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: any

networks:
  # Both created outside this stack: proxy by traefik, internal once by hand.
  proxy:
    external: true
  internal:
    external: true
    name: doublesleeve_internal

volumes:
  ps_img:
  ps_var:
  ps_upload:
  ps_download:
  ps_config:
