# Production, as a Swarm stack.
#
#   docker stack deploy -c devops/prod/stack.yml doublesleeve
#
# Upgrading is changing APP_IMAGE_TAG and running that again. Nothing else. No
# script, no exec, no step afterwards: the container applies pending migrations
# itself on start (devops/image/entrypoint.sh), and Swarm rolls replicas one at
# a time and stops if one fails to come up.
#
# Rolling back is the same command with the previous tag, and it is safe because
# migrations are forward-only and backward-compatible - the older image runs
# against the newer schema. See docs/deployment.md, "The upgrade contract".
version: "3.8"

services:
  shop:
    image: ${APP_IMAGE:-ghcr.io/karlokr/doublesleeve}:${APP_IMAGE_TAG:-latest}
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      PS_DOMAIN: ${PS_DOMAIN}
      PS_FOLDER_ADMIN: ${PS_FOLDER_ADMIN}
      # Install-time only: the base image passes this to the installer. On an
      # installed shop the live setting is PS_SSL_ENABLED in ps_configuration,
      # not this. Left here so a from-scratch install comes up on https.
      PS_SSL_ENABLED: "1"
      # The shop is installed once, by the provisioning pass. If this were 1 the
      # entrypoint would try to install over a live shop on every deploy.
      PS_INSTALL_AUTO: "0"
    volumes:
      # Only state. Everything else - core, modules, theme, ops - comes from the
      # image and is replaced wholesale, which is what makes a deploy atomic.
      - ps_img:/var/www/html/img
      - ps_var:/var/www/html/var
      - ps_upload:/var/www/html/upload
      - ps_download:/var/www/html/download
      - ps_config:/var/www/html/app/config
    networks: [proxy, internal]
    deploy:
      replicas: 1
      placement:
        constraints:
          # Local volumes do not follow a task to another node, so a reschedule
          # elsewhere would come up against empty ones. Label the node that
          # holds them, once:
          #
          #   docker node update --label-add doublesleeve=true <node>
          #
          # If that label is missing the task stays pending, which is the right
          # failure: visible, and not "the shop came back with no images".
          - "node.labels.doublesleeve==true"
        max_replicas_per_node: 1
      update_config:
        # One at a time, and only after the new task is actually healthy. This is
        # what makes "change the tag and redeploy" safe on its own.
        order: start-first
        failure_action: rollback
        delay: 10s
        monitor: 90s
      rollback_config:
        order: start-first
      restart_policy:
        condition: any
      resources:
        limits: { memory: 4G }
        reservations: { memory: 1G }
      # Ingress is devops/prod/traefik-stack.yml, which owns the `proxy`
      # network, the `websecure` entrypoint and the `sslresolver` resolver named
      # below. websecure already sets tls + certresolver at the entrypoint, so
      # the router needs a host rule and nothing more. Port 80 is the container
      # port; Traefik terminates TLS and http is redirected to https upstream.
      labels:
        traefik.enable: "true"
        traefik.http.routers.doublesleeve.rule: Host(`${PS_DOMAIN}`)
        traefik.http.routers.doublesleeve.entryPoints: websecure
        traefik.http.services.doublesleeve.loadbalancer.server.port: "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      # Generous, because a first start migrates before it serves anything.
      start_period: 180s

  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.labels.doublesleeve==true"
      restart_policy:
        condition: any
      resources:
        limits: { memory: 2G }
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.53
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
    volumes:
      - meili_data:/meili_data
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.labels.doublesleeve==true"
      restart_policy:
        condition: any

  cron:
    image: ${APP_IMAGE:-ghcr.io/karlokr/doublesleeve}:${APP_IMAGE_TAG:-latest}
    # Same image as the shop, so scheduled work runs exactly the code the site
    # serves. Migrations are the web container's job, not this one's.
    entrypoint: ["cron", "-f", "-L", "15"]
    environment:
      DB_SERVER: db
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWD: ${DB_PASSWORD}
      CC_MIGRATE: "0"
    volumes:
      - ps_img:/var/www/html/img
      - ps_var:/var/www/html/var
      - ps_config:/var/www/html/app/config
    networks: [internal]
    deploy:
      replicas: 1
      placement:
        constraints:
          - "node.labels.doublesleeve==true"
      restart_policy:
        condition: any

networks:
  # Created by the Traefik stack, which must be deployed first.
  proxy:
    external: true
  internal:
    driver: overlay

volumes:
  db_data:
  meili_data:
  ps_img:
  ps_var:
  ps_upload:
  ps_download:
  ps_config:
