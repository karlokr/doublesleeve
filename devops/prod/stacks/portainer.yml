# ─────────────────────────────────────────────────────────────────────────────
# Portainer CE — Container management UI (Swarm stack, single node)
#
# Deploy:
#   docker stack deploy -c portainer.yml portainer
#
# NOTE: the live copy is /swarm/stacks/portainer.yml on the host. This file is
# the version-controlled record of it, and that pair has drifted before on other
# hosts. If you change one, change the other.
#
# Access: https://portainer.doublesleeve.org
#
# One router, locked to the source IPs in the allowlist below. There is no
# webhook router here: doublesleeve has no CI to fire one. Releases are cut by
# hand from a workstation (devops/release.sh) and deploys are a stack deploy, so
# the opening that a webhook route exists to create would have nothing on the
# other end of it. Add it back the day CI exists, not before.
# ─────────────────────────────────────────────────────────────────────────────

services:
  portainer:
    image: portainer/portainer-ce:2.40.0-alpine
    command: -H unix:///var/run/docker.sock
    deploy:
      replicas: 1
      labels:
        traefik.enable: "true"
        traefik.swarm.network: proxy
        traefik.http.routers.portainer.rule: Host(`portainer.doublesleeve.org`)
        traefik.http.routers.portainer.entryPoints: websecure
        traefik.http.routers.portainer.priority: "1000"
        traefik.http.routers.portainer.tls.certresolver: sslresolver
        traefik.http.routers.portainer.middlewares: portainer-ip-allowlist@swarm
        traefik.http.routers.portainer.tls.domains[0].main: doublesleeve.org
        traefik.http.routers.portainer.tls.domains[0].sans: "portainer.doublesleeve.org"
        traefik.http.routers.portainer.service: portainer
        traefik.http.services.portainer.loadbalancer.server.port: 9000
        traefik.http.middlewares.portainer-ip-allowlist.ipAllowList.sourceRange: 184.64.184.188/32, 174.7.36.28/32
        # depth 1 = the last hop in X-Forwarded-For, which is what Cloudflare
        # sets. Correct only while the record is proxied; unproxy it and this
        # reads the wrong address.
        traefik.http.middlewares.portainer-ip-allowlist.ipAllowList.ipStrategy.depth: 1
    networks:
      - proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # A named volume rather than a bind, because this host is freshly imaged
      # and has no /config_local layout to bind into.
      - portainer_data:/data

networks:
  proxy:
    external: true

volumes:
  portainer_data:
