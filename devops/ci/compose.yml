# The CI runner.
#
# Deliberately NOT part of the GitLab Swarm stack, for a reason that is easy to
# lose an evening to: Swarm services cannot be privileged, and they cannot be
# given the host's Docker socket in a way that behaves. A runner is host-local
# infrastructure rather than a replicated service, so it runs as an ordinary
# container on whichever node you want builds to happen on.
#
#   docker compose -f devops/ci/compose.yml up -d
#
# Register it first - see devops/ci/README.md. GitLab 19 issues a runner
# authentication token (`glrt-...`) from the UI; the old registration-token flow
# is gone.
services:
  runner:
    image: gitlab/gitlab-runner:v17.7.0
    container_name: doublesleeve-runner
    restart: unless-stopped
    volumes:
      # The runner's own config, including the token it registered with.
      - ./config:/etc/gitlab-runner
      # The host's Docker daemon. This is what lets jobs build images WITHOUT
      # docker-in-docker and without privileged mode - see README.md for what
      # that trade actually is.
      - /var/run/docker.sock:/var/run/docker.sock
    # The runner container itself does nothing but poll and spawn; the work
    # happens in the containers it starts.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
